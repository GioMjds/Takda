version: "3.9"

services:
  api:
    build:
      context: ./api

    container_name: takda-api

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules

  postgres:
    image: postgres:17-alpine

    container_name: takda-postgres

    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]

      interval: 10s

      timeout: 5s

      retries: 5

  redis:
    image: redis:8-alpine

    container_name: takda-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit

    container_name: takda-mailpit

    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:

  redis-data:
